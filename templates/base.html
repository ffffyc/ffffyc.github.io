<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ base }}files/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="{{ base }}files/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ base }}files/icon-180.png">
  <link rel="stylesheet" href="{{ base }}assets/style.css?v={{ site.v }}">
  <link rel="stylesheet" href="{{ base }}assets/pygments.css?v={{ site.v }}">
  <style>
    body::before { background-image: url("{{ base }}files/background.jpg"); }
  </style>
  {% if math %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="{{ base }}assets/math.js?v={{ site.v }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  {% endif %}
</head>
<body class="{% if wide %}wide{% endif %}{% if wider %} wider{% endif %}">
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ base }}">{{ site.title }}</a>
      <nav class="nav">
        <a href="{{ base }}past/"{% if section == 'past' %} class="on"{% endif %}>过往文章</a>
        <a href="{{ base }}notes/"{% if section == 'notes' %} class="on"{% endif %}>学习资料</a>
      </nav>
    </div>
  </header>

  <main class="wrap{% if wide %} wide{% endif %}{% if wider %} wider{% endif %}">
    {% block main %}{% endblock %}
  </main>

  <footer class="foot">
    <div class="wrap">{{ site.footer }}</div>
  </footer>

  <script>
  // 目录：滚动时高亮当前小节（文章页与课程条目页共用）
  (function () {
    var links = Array.prototype.slice.call(
      document.querySelectorAll('.toc a[href^="#"]:not(.toc-doc)')
    );
    if (!links.length) return;
    var map = {}, heads = [];
    links.forEach(function (a) {
      var id = decodeURIComponent(a.getAttribute('href').slice(1));
      var el = document.getElementById(id);
      if (el) { map[id] = a; heads.push(el); }
    });
    function sync() {
      var y = window.scrollY + 140, cur = heads[0];
      heads.forEach(function (h) { if (h.offsetTop <= y) cur = h; });
      links.forEach(function (a) { a.classList.toggle('active', a === map[cur.id]); });
    }
    window.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
    sync();
  })();

  // 点击正文标题即可定位到该节，并把锚点写进地址栏
  document.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var h = e.target.closest('.prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6');
    if (!h || !h.id) return;
    history.replaceState(null, '', '#' + h.id);
    h.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  </script>
</body>
</html>
