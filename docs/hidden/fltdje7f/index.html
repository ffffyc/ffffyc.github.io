  <script>
  // 目录：滚动时高亮当前小节（文章页与课程条目页共用）
  (function () {
    var links = Array.prototype.slice.call(
      document.querySelectorAll('.toc a[href^="#"]:not(.toc-doc)')
    );
    if (!links.length) return;
    var map = {}, heads = [];
    links.forEach(function (a) {
      var id = decodeURIComponent(a.getAttribute('href').slice(1));
      var el = document.getElementById(id);
      if (el) { map[id] = a; heads.push(el); }
    });
    function sync() {
      var y = window.scrollY + 140, cur = heads[0];
      heads.forEach(function (h) { if (h.offsetTop <= y) cur = h; });
      links.forEach(function (a) { a.classList.toggle('active', a === map[cur.id]); });
    }
    window.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
    sync();
  })();

  // 点击正文标题即可定位到该节，并把锚点写进地址栏

    history.replaceState(null, '', '#' + h.id);
